<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malika Atelier • Майнд-карта проекта</title><style>
/*
VOICE: спокойная рабочая карта, чистая и читабельная
IDEA: светящаяся схема завода, ветки как линии подачи
PICTURE: сама карта на весь экран, крупные узлы, тонкие изогнутые связи
COLOUR and TYPE: белый фон, синий основной, голубой и тёмно-синий для веток; Inter Tight + Inter
LAYOUT: панель сверху, карта ниже, клик раскрывает ветку
*/
:root{color-scheme:light;--bg:#f4f7fd;--ink:#0f1b3d;--mute:#5b6785;--card:#fff;--card2:#fff;--line:#d6def0;--rose:#2f5bea;--dusk:#0ea5e9;--mint:#1e40af;--gold:#f5b400}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
header{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px max(2vw,14px);background:linear-gradient(#f4f7fd 70%,rgba(244,247,253,0))}
h1{font:300 clamp(22px,3vw,34px)/1.05 'Inter Tight',sans-serif;margin:0 auto 0 0;letter-spacing:-.01em}
h1 b{font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input{font:500 14px Inter,sans-serif;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:999px;height:40px;padding:0 16px;cursor:pointer}
button:hover{border-color:var(--rose)}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
input{width:210px;cursor:text;font-size:16px}
input::placeholder{color:var(--mute)}button{background:#fff}
#vp{position:absolute;inset:0;cursor:grab;touch-action:none}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;padding:40px 60px}
svg#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.n{display:flex;align-items:center;gap:56px;flex-shrink:0}.card,.kids{flex-shrink:0}
.kids{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.kids.row{flex-direction:row;align-items:flex-start;gap:40px}
.kids.row>.n{flex-direction:column;align-items:flex-start;gap:22px}
.kids.row>.n>.kids{gap:12px}
.n.closed>.kids{display:none}
.card{position:relative;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 10px rgba(15,27,61,.06);border-radius:16px;padding:12px 16px;max-width:320px;cursor:default;transition:border-color .2s,box-shadow .2s,opacity .2s}
.card.has{cursor:pointer}
.card.has::after{content:attr(data-c);position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:700 12px/24px Inter;text-align:center}
.n:not(.closed)>.card.has::after{content:'−'}
.card:hover{border-color:var(--c)}
.t{font-weight:600}
.card ol,.card ul{margin:6px 0 0;padding-left:20px}
.card li{margin:3px 0}
.card p{margin:6px 0 0;color:#26324f}
.card .sub{color:var(--mute);font-size:13px;margin-top:4px}
.root{background:var(--rose);color:#fff;border:0;font:700 22px/1.1 'Inter Tight',Inter,sans-serif;padding:22px 26px;max-width:220px;box-shadow:0 12px 40px rgba(47,91,234,.35)}
.root::after{background:#fff!important;color:var(--rose)!important}
.l1{background:color-mix(in srgb,var(--c) 10%,#fff);border:1.5px solid var(--c);font:700 18px/1.2 'Inter Tight',Inter,sans-serif;padding:14px 20px;box-shadow:0 0 30px color-mix(in srgb,var(--c) 22%,transparent)}
.step{border-top:3px solid var(--c);min-width:180px}
.step .num{font:700 26px/1 'Inter Tight',Inter,sans-serif;color:var(--c);margin-bottom:4px}
.big{font:700 22px/1.15 'Inter Tight',Inter,sans-serif;color:var(--c)}
.wide{max-width:430px}.card.tbl{max-width:none;width:max-content}
.media{display:flex;gap:8px;margin-top:8px}
.media img{width:92px;border-radius:10px;display:block}
.shot{width:380px;border-radius:10px;margin-top:8px;display:block}
a{color:var(--c)}
table{border-collapse:collapse;margin-top:8px;font-size:13px;width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.hl td{color:var(--rose);font-weight:700}
.dim .card{opacity:.25}
.dim .card.hit{opacity:1;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.hint{position:fixed;left:max(2vw,14px);bottom:14px;color:var(--mute);font-size:13px;z-index:5;background:rgba(244,247,253,.85);padding:4px 8px;border-radius:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
@media(max-width:600px){header{padding:10px 12px;gap:8px}h1{width:100%;font-size:20px}.tools{width:100%;gap:6px}input{width:100%;height:36px}button{height:34px;padding:0 12px;font-size:13px}.hint{display:none}}
.vid{position:relative;padding:0;border:0;height:auto;border-radius:10px;overflow:hidden;background:#000;cursor:pointer}
.vid span{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#fff;background:rgba(15,27,61,.25)}
.vid:hover span{background:rgba(47,91,234,.45)}
#lb{position:fixed;inset:0;z-index:20;background:rgba(15,27,61,.82);display:none;place-items:center}
#lb.on{display:grid}#lb video{max-height:88vh;max-width:92vw;border-radius:14px;background:#000}
#lbx{position:absolute;top:16px;right:16px;background:#fff;color:#0f1b3d}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{font-family:Inter,system-ui,-apple-system,sans-serif}.root .sub{color:#dbe6ff}.root{max-width:245px}.l1{max-width:280px}.weekcard{border-left:4px solid var(--c);min-width:280px}.card{max-width:350px}.wide{max-width:430px}.n{gap:56px}.kids{gap:12px}.day-label,.week-label{font-size:11px;color:var(--c);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:700}.owner{font-size:11px;color:var(--mute);margin-top:8px}.donebox{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:9px;cursor:pointer}.donebox input{width:15px;height:15px;padding:0;margin:0;accent-color:var(--rose)}.card.done{background:#eff8ef;border-color:#63a36a}.card.done .t{text-decoration:line-through;text-decoration-color:#98b79b}.tools input[type=date]{width:142px;font-size:12px;padding:0 10px;height:34px}.settings{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:11px}.tools{gap:6px}button,input{font-family:inherit}.hint{max-width:90vw;pointer-events:none}#searchCount{font-size:11px;color:var(--mute);min-width:70px}.searchnav{display:none}.searchnav.show{display:inline-block}#fullplan{position:fixed;inset:0;z-index:30;background:#fff;display:none}#fullplan.on{display:block}#fullplan iframe{width:100%;height:calc(100% - 50px);border:0}#fullplan .bar{height:50px;display:flex;align-items:center;gap:15px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}#fullplan .bar span{flex:1;font-size:12px;color:var(--mute)}.range{font-weight:400;font-size:11px;color:var(--mute);margin-top:4px}.card:focus-visible{outline:3px solid var(--rose)}@media(max-width:800px){h1{font-size:23px;width:100%}.tools{width:100%}.tools #q{flex:1;min-width:140px;width:140px}.settings{width:100%}.tools button{font-size:12px;padding:0 11px;height:34px}.hint{font-size:11px;bottom:8px}.card{font-size:14px}header{background:linear-gradient(#f4f7fd 90%,rgba(244,247,253,.85));padding-bottom:12px}}@media(max-width:480px){.tools{gap:5px}.tools #q{width:100%;flex:1 0 100%}.tools input[type=date]{height:30px;font-size:11px}.settings{gap:6px}.settings span{font-size:10px}.hint{display:block;font-size:10px;max-width:95vw}}
#world,#tree{width:max-content}.settings input[type=date]{width:142px;height:30px;padding:0 9px;font-size:12px}.settings{flex-wrap:wrap}.ownerneeds{border:1.5px solid #cf9419;background:#fff8e6}.ownerneeds>.t{color:#85600c}</style></head><body><header><h1><b>Malika Atelier</b> · карта проекта</h1><div class="tools"><input id="q" type="search" placeholder="Найти задачу или метрику" aria-label="Поиск по карте"><button id="open">Раскрыть всё</button><button id="close">Обзор</button><button id="fit">По размеру</button><button id="zin" aria-label="Приблизить">+</button><button id="zout" aria-label="Отдалить">−</button><button id="detail">Полный план</button><button id="prev" class="searchnav" aria-label="Предыдущий результат">↑</button><button id="next" class="searchnav" aria-label="Следующий результат">↓</button><span id="searchCount" aria-live="polite"></span></div><div class="settings"><label for="start">Предлагаемый старт</label><input id="start" type="date" value="2026-11-30"><span id="period"></span><span id="doneCount"></span></div></header><div id="vp" aria-label="Интерактивная майнд-карта"><div id="world"><svg id="links" aria-hidden="true"></svg><div id="tree"></div></div></div><div class="hint">Клик раскрывает ветку · тяните полотно для перемещения · колесо или два пальца меняют масштаб</div><div id="fullplan" role="dialog" aria-modal="true" aria-label="Подробная дорожная карта"><div class="bar"><span>Все задачи, метрики и бюджет в подробном виде</span><button id="back">Вернуться к карте</button></div><iframe id="planframe" title="Подробная дорожная карта"></iframe></div><script id="map-data" type="application/json">{"tree": {"t": "Malika Atelier", "cls": "root", "sub": "Контент-завод · 8 недель", "kids": [{"t": "Дорожная карта по неделям", "cls": "l1", "key": "schedule", "kids": [{"t": "Основа для продаж и найма", "week": 0, "cls": "weekcard", "kids": [{"t": "Результат недели", "html": "<p>Карта бренда v1; анализ 10 конкурентов; разбор присланных роликов и покупателей; аудит продаж; вакансии и кандидаты; согласованные лимиты затрат.<\/p><p>Дополнительно: схемы трёх воронок, тема лид-магнита, выбранный трипваер и паспорт специального новогоднего продукта с согласованной экономикой.<\/p>", "cls": "wide"}, {"t": "Метрики недели", "html": "<p>10 конкурентов; 2 паспорта товаров; 3 сегмента кастдева; 5 первых интервью; 100% новых обращений фиксируются в едином реестре с Д3.<\/p><p>3 описанные воронки; 1 выбранный лид-магнит; 1 трипваер; 1 новогоднее предложение. У каждой схемы есть CTA, путь оплаты, ответственный и способ учёта.<\/p>", "cls": "wide"}, {"t": "Задача этапа", "html": "<p>Утвердить карту бренда, экономику двух товаров и систему учёта. Запустить подбор креаторов параллельно с исследованием.<\/p>", "cls": "wide"}, {"t": "Разработка воронок и новогоднего продукта", "key": "funnels", "kids": [{"t": "1. Лид-магнит → контакт → покупка", "html": "<p>Подобрать полезный материал для целевой покупательницы, например гид по зимним образам или подбору посадки. Спроектировать путь: ролик → запрос/ссылка → выдача материала → вопрос о потребности → подбор товара менеджером → оплата. Это гипотеза; конкретную тему выбрать по кастдевам.<\/p>", "cls": "wide"}, {"t": "2. Трипваер → основной товар", "html": "<p>Выбрать недорогой входной продукт из ассортимента: кандидат — шапка, её точная цена и маржа требуют подтверждения. Спроектировать путь: контент → доступная первая покупка → предложение подходящего основного товара. Проверить, что доставка и комиссии не съедают вклад заказа.<\/p>", "cls": "wide"}, {"t": "3. Прямой переход к основному товару", "html": "<p>Ролик с джерси или комбинезоном → карточка/директ → консультация по размеру → оплата. Зафиксировать CTA, точки передачи менеджеру и последующее обращение к тем, кто не оплатил, по согласованным правилам коммуникации.<\/p>", "cls": "wide"}, {"t": "4. Специальный новогодний продукт", "html": "<p>Разработать 2–3 варианта: подарочный бокс, комплект из имеющихся товаров или сертификат. Выбрать один по спросу, срокам и экономике. Новая физическая модель одежды не предполагается без отдельного решения о производстве.<\/p>", "cls": "wide"}, {"t": "5. Паспорт новогоднего продукта", "html": "<p>Получатель и повод покупки; состав, варианты и размеры; упаковка и комплектация; цена, себестоимость, маржа; лимит доступных комплектов; сроки запуска и доставки; материалы для продажи; условия сертификата, если выбран он.<\/p>", "cls": "wide"}, {"t": "6. Измерение каждой воронки", "html": "<p>На Н1 задать события и источники: просмотры/клики → запросы → выданные материалы/контакты → обращения → оплаты → повторная покупка. Для трипваера отдельно отслеживать маржу первой покупки и переход к основному товару. Числовые планы утверждать после базовых замеров.<\/p>", "cls": "wide"}]}, {"t": "Что нужно от собственников и команды бренда", "key": "brand-needs", "cls": "ownerneeds", "kids": [{"t": "Подтвердить старт, контакт и лимиты", "sub": "Ролан + Соня · Дни 1–2", "html": "<p>Подтвердить дату старта, полномочия Сони, участников рабочей группы, бюджет найма, тестов, стажировки, бонусов и доставки. Зафиксировать время еженедельного созвона и порядок срочных решений.<\/p>", "cls": "wide"}, {"t": "Передать экономику и наличие двух товаров", "sub": "Соня; цены и маржу утверждает Ролан · До конца дня 2", "html": "<p>Заполненные карточки джерси №22 и красно-чёрного комбинезона: цена, себестоимость, размеры, остатки, характеристики, сроки производства. Отдельно отметить, какие обещания допустимы в контенте.<\/p>", "cls": "wide"}, {"t": "Организовать данные и доступ к продажам", "sub": "Соня + РОП · Дни 1–3", "html": "<p>Обезличенная выгрузка из МоегоСклада: ID заказа, дата, товар, сумма, способ оплаты, возвраты, новый/повторный клиент; доступная статистика аккаунта и ответственный за ежедневный учёт. Присланные профили, топ и антитоп повторно не собираем.<\/p>", "cls": "wide"}, {"t": "Выделить РОПа для кастдевов и аудита", "sub": "Ролан назначает; РОП выполняет · Дни 3–5", "html": "<p>РОП участвует в обучении и ролевке, подбирает три сегмента базы, проводит первые 5 интервью и обеспечивает учёт источника обращений. Бренд утверждает подарок за участие.<\/p>", "cls": "wide"}, {"t": "Дать обратную связь по карте бренда", "sub": "Соня собирает; Ролан утверждает спорные решения · В течение 2 рабочих дней после получения", "html": "<p>Единый список правок по аудитории, товарному фокусу, смыслам, визуалу и ограничениям. Ролан участвует в разборе текущего подбора блогеров.<\/p>", "cls": "wide"}, {"t": "Утвердить воронки, трипваер и новогодний продукт", "sub": "Ролан + Соня + РОП · Конец Н1, в течение 2 рабочих дней после предложения", "html": "<p>Подтвердить тему лид-магнита, продукт и цену трипваера, схему передачи заявок; выбрать новогодний бокс/комплект/сертификат. Утвердить состав, себестоимость, маржу, наличие, упаковку, бюджет подготовки и сроки запуска.<\/p>", "cls": "wide"}]}, {"t": "Старт и проверка исходных данных", "day": 0, "kids": [{"t": "Что делаем", "html": "<p>Свести бриф, запись, полученные профили покупателей, топ и антитоп роликов в один реестр. Проверить октябрь и ноябрь по выгрузке; согласовать определение оплаченного заказа.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Реестр исходных данных; исходные KPI; список недостающих данных и ответственных.<\/p>", "cls": "wide"}], "owner": "Ольга + аналитик; Соня + РОП"}, {"t": "Экономика и портрет покупательницы", "day": 1, "kids": [{"t": "Что делаем", "html": "<p>Разобрать присланные профили и историю покупок. Собрать паспорта чёрного джерси №22 и красно-чёрного комбинезона: цена, размеры, остатки, себестоимость, возвраты, маржа. Запустить вакансии и первичный отбор.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>2 паспорта товаров; 2–3 гипотезы ЦА; объявления о поиске креаторов.<\/p>", "cls": "wide"}, {"t": "Воронки: товар и экономика", "html": "<p>Выбрать кандидата на трипваер, проверить цену/маржу и собрать вводные для специального новогоднего продукта. Разобрать, что можно собрать из текущих остатков без нового производства.<\/p>", "cls": "wide"}], "owner": "Стратег + рекрутер; Соня + Ролан"}, {"t": "Контент и путь до оплаты", "day": 2, "kids": [{"t": "Что делаем", "html": "<p>Разметить удачные и слабые ролики: хук, подача, товар, просмотры, обращения, известные продажи. Провести тайного покупателя по комбинезону/куртке, без нового джерси. Ввести учёт источника и времени ответа.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Матрица контента; аудит переписки; работающий реестр обращений.<\/p>", "cls": "wide"}, {"t": "Воронки: схема пути клиента", "html": "<p>Спроектировать три пути: лид-магнит → контакт → основной товар; трипваер → основной товар; прямая продажа основного товара. Для каждого определить CTA, место выдачи/оплаты, передачу менеджеру и события аналитики.<\/p>", "cls": "wide"}], "owner": "Контент-лид + аналитик; РОП"}, {"t": "Конкуренты и обучение кастдеву", "day": 3, "kids": [{"t": "Что делаем", "html": "<p>Разобрать 10 конкурентов по контенту, офферам и пути покупки. Подготовить вопросы кастдева; обучить РОПа через ролевую беседу. Согласовать подарок за участие и три сегмента для интервью.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Анализ 10 конкурентов; сценарий интервью; РОП прошёл ролевку.<\/p>", "cls": "wide"}, {"t": "Новогодний продукт: разработка", "html": "<p>На базе первых интервью и анализа конкурентов подготовить 2–3 концепции и выбрать одну. Собрать паспорт продукта: состав, подарок/упаковка, цена, маржа, объём, сроки и ограничения.<\/p>", "cls": "wide"}], "owner": "Стратег + Ольга; РОП + Соня"}, {"t": "Карта бренда и первые интервью", "day": 4, "kids": [{"t": "Что делаем", "html": "<p>Провести первые 5 кастдевов. Собрать смыслы, возражения, визуальные правила и 8–12 контент-гипотез. Разобрать с Роланом его подход к выбору блогеров; выдать критерии. Отправить карту и приоритеты на согласование.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Карта бренда v1; 5 карточек интервью; критерии подбора блогеров.<\/p>", "cls": "wide"}, {"t": "Согласование воронок и новогоднего предложения", "html": "<p>Передать бренду схемы трёх воронок, тему лид-магнита, трипваер и паспорт новогоднего продукта. Утвердить доступность, цену и маржу; назначить исполнителей на подготовку в Н2.<\/p>", "cls": "wide"}], "owner": "Ольга + контент-лид; РОП + Ролан"}, {"t": "Выходной: сбор анкет и наблюдение", "day": 5, "kids": [{"t": "Что делаем", "html": "<p>Приём анкет продолжается. Зафиксировать заявки и продажи по текущим каналам; дежурный менеджер не оставляет обращения без ответа.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Новые анкеты в реестре; обращения учтены.<\/p>", "cls": "wide"}], "owner": "Рекрутер; дежурный менеджер"}, {"t": "Итог первой недели", "day": 6, "kids": [{"t": "Что делаем", "html": "<p>Свести результаты исследования и найма. Обновить открытые вопросы; собрать повестку встречи и план следующей недели.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отчёт №1: план/факт, выводы, решения, риски и ответственные.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта + аналитик"}, {"t": "Условие перехода дальше", "html": "<p>Есть цены, остатки и себестоимость; назначены ответственные; согласован бюджет образцов и стажировки; утверждены критерии отбора.<\/p>", "cls": "wide"}]}, {"t": "Сценарии, отбор и первые пробы", "week": 1, "cls": "weekcard", "kids": [{"t": "Результат недели", "html": "<p>150 согласованных сценариев; 10–15 кастдевов суммарно; до 8 кандидатов; образцы отправлены; первые тестовые видео при своевременной доставке.<\/p><p>Дополнительно: подготовлены и проверены выдача лид-магнита, покупка трипваера и основного товара; специальный новогодний продукт оформлен для продажи; первые запуски на текущей аудитории.<\/p>", "cls": "wide"}, {"t": "Метрики недели", "html": "<p>150 сценариев; 10–15 интервью суммарно; ориентир найма: 40 релевантных анкет → 12 собеседований → 6–8 тестов; 2–3 технических аккаунта готовы; к Н3 отдельный аккаунт каждому допущенному стажёру.<\/p><p>Каждая воронка пройдена тестовым обращением от входа до оплаты; ссылки и передача менеджеру проверены. Фактические показатели конверсии собираются отдельно по каждой воронке.<\/p>", "cls": "wide"}, {"t": "Задача этапа", "html": "<p>Закрыть основные гипотезы ЦА, собрать банк сценариев и подготовить кандидатов к стажировке.<\/p>", "cls": "wide"}, {"t": "Подготовка и запуск воронок", "key": "funnels", "kids": [{"t": "Готовый лид-магнит", "html": "<p>Создать и оформить выбранный материал; подготовить страницу/сообщение выдачи и способ сохранения контакта. Подключить выдачу через доступные инструменты; бот или интеграция, требующие отдельной оплаты, утверждаются с брендом.<\/p>", "cls": "wide"}, {"t": "Готовый трипваер", "html": "<p>Подготовить предложение, карточку товара, цену и путь оплаты. Дать менеджерам сценарий продажи и перехода к основному товару. Проверить наличие и положительную экономику с доставкой.<\/p>", "cls": "wide"}, {"t": "Готовый новогодний продукт", "html": "<p>Собрать пробный комплект или макет сертификата, подтвердить упаковку, остатки, цену и реальные сроки отправки. Сделать фото/видео и продающее описание; подготовить страницу/сообщение заказа и ответы менеджеров.<\/p>", "cls": "wide"}, {"t": "Техническая проверка до публикаций", "html": "<p>Пройти весь путь тестовым обращением: ссылка/кодовое слово → выдача → учёт контакта → диалог → заказ → подтверждение оплаты. Проверить мобильную версию, уведомления, передачу менеджеру и фиксацию источника.<\/p>", "cls": "wide"}, {"t": "Первые запуски на текущей аудитории", "html": "<p>Запустить согласованные предложения в текущих каналах бренда, чтобы начать проверку до полноценного выхода креаторов. Выдать креаторам готовые CTA, ссылки и сценарии с привязкой к воронкам.<\/p>", "cls": "wide"}, {"t": "Результат второй недели", "html": "<p>Лид-магнит доступен и выдаётся; трипваер и основной товар доступны к покупке; новогоднее предложение оформлено и запущено при наличии и подтверждённых сроках. Есть события в учёте и первые фактические данные, без обещанного количества продаж.<\/p>", "cls": "wide"}]}, {"t": "Что нужно от собственников и команды бренда", "key": "brand-needs", "cls": "ownerneeds", "kids": [{"t": "Утвердить карту и пакет сценариев", "sub": "Соня + Ролан · В начале Н2; каждый пакет в течение 2 рабочих дней", "html": "<p>Одно согласованное решение по основному товару и карте бренда; сводные правки по первому пакету и банку из 150 сценариев без противоречащих комментариев от разных участников.<\/p>", "cls": "wide"}, {"t": "Отправить образцы кандидатам", "sub": "Соня + склад бренда · Сразу после утверждения размеров и адресов, ориентир дни 9–10", "html": "<p>Подтвердить наличие образцов, комплектацию, отправить их и передать трек-номера. Организовать обмен размера, если требуется. До отправки подтвердить фактическую дату доставки, от которой зависит старт съёмок.<\/p>", "cls": "wide"}, {"t": "Обеспечить регистрацию аккаунтов", "sub": "Соня со стороны бренда; техническая команда проекта помогает создать и оформить · Дни 9–10; готовность до стажировки", "html": "<p>Выделить почту и номера для 2–3 стартовых аккаунтов, подтвердить регистрации и доступы. До Н3 организовать отдельный аккаунт каждому допущенному стажёру; после отбора оставить четыре основных. Учётные записи остаются под контролем бренда.<\/p>", "cls": "wide"}, {"t": "Подготовить менеджеров к новому трафику", "sub": "РОП + Соня · До первых публикаций", "html": "<p>Готовые ответы по цене, посадке, размерам, материалам, доставке и рассрочке; рабочие ссылки и путь оплаты. По джерси завершить размерную сетку и обучение менеджеров до начала продвижения.<\/p>", "cls": "wide"}, {"t": "Завершить кастдев и условия стажировки", "sub": "РОП; бюджет и условия подтверждает Ролан · К концу Н2, до допуска стажёров", "html": "<p>10–15 интервью суммарно; подтверждённый подарок участникам; согласованные выплаты стажёрам, правила бонусов, образцов и использования контента.<\/p>", "cls": "wide"}, {"t": "Подготовить товарную часть новогоднего запуска", "sub": "Соня + склад; Ролан утверждает расходы · Дни 8–10, до запуска", "html": "<p>Собрать пробный комплект или сертификат; подтвердить упаковку, наличие, комплектацию, стоимость, лимиты и график доставки. Обеспечить исходные фото/видео товара или образец для съёмки.<\/p>", "cls": "wide"}, {"t": "Обеспечить готовность выдачи, оплаты и продаж", "sub": "Соня + РОП; техническая команда проекта помогает · До первых запусков на Н2", "html": "<p>Согласовать места размещения материалов, доступ к нужным каналам, ссылки и порядок выдачи. Утвердить условия новогоднего предложения, обучить менеджеров и участвовать в тесте пути клиента.<\/p>", "cls": "wide"}]}, {"t": "Утверждение стратегии и план-факт", "day": 7, "kids": [{"t": "Что делаем", "html": "<p>Провести встречу по итогам Н1. Учесть правки карты бренда; выбрать основной товар по марже, наличию и спросу. Второй оставить отдельной тестовой гипотезой. Утвердить 30 приоритетных сценариев.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Карта бренда утверждена; первый пакет 30 сценариев; фокус на старт.<\/p>", "cls": "wide"}, {"t": "Производство материалов для воронок", "html": "<p>После согласования начать создание лид-магнита, описаний трипваера и основного товара. Утвердить финальную комплектацию новогоднего продукта и план упаковки/контента.<\/p>", "cls": "wide"}], "owner": "Ольга + контент-лид; Соня + Ролан"}, {"t": "Групповые собеседования", "day": 8, "kids": [{"t": "Что делаем", "html": "<p>Оценить подачу, визуальное соответствие ЦА, речь, условия съёмки и дисциплину. Выдать одинаковое тестовое задание; согласовать оплату тестов, если она предусмотрена, отдельно от стажировки.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Шорт-лист 6–8 кандидатов; единая оценочная форма.<\/p>", "cls": "wide"}, {"t": "Создание новогоднего продукта", "html": "<p>Бренд собирает пробный бокс/комплект или готовит сертификат; команда проекта готовит оффер, продающее описание и сценарии контента. Подтвердить цену, наличие и даты отправки.<\/p>", "cls": "wide"}], "owner": "Рекрутер + контент-лид"}, {"t": "Образцы, аккаунты и аналитика", "day": 9, "kids": [{"t": "Что делаем", "html": "<p>Отправить образцы с трек-номерами; проверить размеры. Подготовить 2–3 технических аккаунта для первого запуска; до стажировки выделить отдельный аккаунт каждому допущенному стажёру, затем оставить четыре основных. Настроить UTM, реестр ID роликов и передачу обращений.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Реестр доставки; аккаунты оформлены; тестовый путь до заказа проверен.<\/p>", "cls": "wide"}, {"t": "Техническая сборка воронок", "html": "<p>Подготовить ссылки, выдачу материала, приём контактов, оформление заказа и передачу менеджеру. Отдельные платные инструменты и интеграции подключать в пределах согласованного бюджета.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта + аналитик; Соня + РОП"}, {"t": "Завершение банка контента", "day": 10, "kids": [{"t": "Что делаем", "html": "<p>Довести банк до 150 сценариев с хуком, кадрами, смыслом, CTA и товаром. Завершить 10–15 интервью суммарно, обновить карту бренда. Отправить полный банк на согласование.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>150 сценариев; сводка кастдева; скорректированные аргументы продажи.<\/p>", "cls": "wide"}, {"t": "Проверка и обучение продажам", "html": "<p>Пройти каждую воронку тестовым обращением, проверить оплату и учёт источника. Передать менеджерам скрипты по лид-магниту, трипваеру, основному и новогоднему предложению; внести правки.<\/p>", "cls": "wide"}], "owner": "Контент-лид + стратег; РОП"}, {"t": "Первые тестовые съёмки", "day": 11, "kids": [{"t": "Что делаем", "html": "<p>Получить и разобрать пробы от кандидатов, которым доставлены образцы. Проверить читаемость товара, первые секунды, звук и точность обещаний. Остальным дать предварительную тренировку подачи без публикации товарных заявлений.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Первые тестовые видео; индивидуальные правки; лист готовности к стажировке.<\/p>", "cls": "wide"}, {"t": "Запуск в текущих каналах бренда", "html": "<p>Запустить проверенные воронки и новогоднее предложение в текущих каналах бренда. В первых тестовых видео использовать согласованные CTA. Начать сбор факта по входам, обращениям и оплатам.<\/p>", "cls": "wide"}], "owner": "Контент-лид + кандидаты"}, {"t": "Тестовые ролики и подготовка", "day": 12, "kids": [{"t": "Что делаем", "html": "<p>Дособрать тесты и правки. Подготовить первые публикации только по согласованным сценариям; записать дату и условия каждого теста.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Тесты оценены; материалы первой недели стажировки готовы.<\/p>", "cls": "wide"}], "owner": "Контент-лид + кандидаты"}, {"t": "Финальный допуск на стажировку", "day": 13, "kids": [{"t": "Что делаем", "html": "<p>Проверить наличие образцов, аккаунтов и условий работы; утвердить до 8 стажёров. Назначить каждому 14 роликов на 7 дней.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отчёт №2; список допущенных стажёров; задания на Н3.<\/p>", "cls": "wide"}, {"t": "Первые выводы по воронкам", "html": "<p>Свести технические ошибки, первые обращения и оплаты. Зафиксировать, какие воронки готовы к трафику стажёров и что исправить. Малый объём данных не выдавать за доказанную конверсию.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта + рекрутер"}, {"t": "Условие перехода дальше", "html": "<p>У каждого стажёра есть товар, согласованное задание, условия оплаты и права на контент. Если доставка задержана, дата его стажировки переносится отдельно.<\/p>", "cls": "wide"}]}, {"t": "Стажировка и проверка гипотез", "week": 2, "cls": "weekcard", "kids": [{"t": "Результат недели", "html": "<p>Стажировка до 8 человек по 14 роликов; оценка качества, дисциплины и отклика; выбор четырёх основных и резерва.<\/p>", "cls": "wide"}, {"t": "Метрики недели", "html": "<p>План: 2 ролика/день на стажёра, 14 за 7 дней; при 4–8 участниках 56–112 роликов. 100% роликов имеют ID, ссылку и замеры 24ч/72ч/7д.<\/p>", "cls": "wide"}, {"t": "Задача этапа", "html": "<p>Проверить креаторов на реальном производстве и получить первую сопоставимую статистику.<\/p>", "cls": "wide"}, {"t": "Что нужно от собственников и команды бренда", "key": "brand-needs", "cls": "ownerneeds", "kids": [{"t": "Подтвердить готовность товаров и образцов", "sub": "Соня + склад · До первого дня стажировки", "html": "<p>У каждого допущенного стажёра есть нужный товар и размер. Быстро организовать замену при браке/ошибке комплектации. Сообщать об изменении цены или остатков до публикации.<\/p>", "cls": "wide"}, {"t": "Обрабатывать спрос и передавать обратную связь", "sub": "РОП + менеджеры · Ежедневно по рабочему графику", "html": "<p>Все обращения, источники, вопросы, оплаты и причины отказов в реестре. Передавать команде вопросы покупателей и ошибки товарных обещаний для корректировки сценариев.<\/p>", "cls": "wide"}, {"t": "Закрывать согласования и выплаты", "sub": "Соня; выплаты обеспечивает Ролан · По согласованному графику, без задержки стажировки", "html": "<p>Сводная обратная связь в пределах 2 рабочих дней. Оплаты принятых опубликованных роликов по утверждённым условиям; оперативное решение по непредвиденной замене образцов.<\/p>", "cls": "wide"}, {"t": "Принять решение по основному составу", "sub": "Ролан + Соня · Итоги Н3 / старт Н4", "html": "<p>Подтвердить продолжение с четырьмя креаторами, бюджет основного состава и резерв. Оценку и рекомендацию готовит команда проекта.<\/p>", "cls": "wide"}]}, {"t": "Запуск стажировки", "day": 14, "kids": [{"t": "Что делаем", "html": "<p>Провести вводную; подтвердить график публикаций и 14 сценариев на человека. Запустить 2 ролика в день от каждого допущенного стажёра. Первый тест: детали товара и стилизация.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Первая партия опубликована; журнал публикаций заполнен.<\/p>", "cls": "wide"}], "owner": "Контент-лид + креаторы"}, {"t": "Хуки и передача лидов", "day": 15, "kids": [{"t": "Что делаем", "html": "<p>Сравнить 2–3 варианта первых секунд на сопоставимых сценариях. Проверить переходы в основной аккаунт и корректность ответа менеджеров на новые вопросы.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Первые замеры 24ч; исправлены разрывы между роликом и продажей.<\/p>", "cls": "wide"}], "owner": "Контент-лид + аналитик; РОП"}, {"t": "Промежуточный разбор", "day": 16, "kids": [{"t": "Что делаем", "html": "<p>Проверить дедлайны и качество; дать каждому одну конкретную корректировку. Сделать первые замеры 72ч; не отбрасывать формат по одному ролику.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Промежуточная оценка каждого стажёра; список изменений.<\/p>", "cls": "wide"}], "owner": "Контент-лид + аналитик"}, {"t": "Возражения и реальные сценарии носки", "day": 17, "kids": [{"t": "Что делаем", "html": "<p>Проверить форматы по материалам кастдевов: посадка, цена, комплекты, доставка, температурный режим только по подтверждённым характеристикам. Комбинезон позиционировать как fashion, без обещаний профессиональной экипировки.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Ещё одна серия гипотез; вопросы покупателей внесены в FAQ.<\/p>", "cls": "wide"}], "owner": "Контент-лид + креаторы; Соня"}, {"t": "Повтор сильных подходов", "day": 18, "kids": [{"t": "Что делаем", "html": "<p>Снять вариации сильных роликов с другим хуком и контекстом; сравнить товары. Подготовить первичный шорт-лист четырёх основных креаторов и резерв.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Кандидаты на основной состав; вариации лидирующих гипотез.<\/p>", "cls": "wide"}], "owner": "Контент-лид + рекрутер"}, {"t": "Завершение съёмок стажировки", "day": 19, "kids": [{"t": "Что делаем", "html": "<p>Продолжить 2 публикации в день; получить все 14 роликов от каждого активного стажёра. Дежурный менеджер обрабатывает обращения.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>План стажировки закрыт или зафиксированы причины отклонений.<\/p>", "cls": "wide"}], "owner": "Креаторы + контент-лид; РОП"}, {"t": "Оценка стажировки", "day": 20, "kids": [{"t": "Что делаем", "html": "<p>Свести качество, соблюдение сроков, просмотры, переходы, обращения и подтверждённые заказы. Выбрать четырёх основных и резерв, подготовить условия продолжения.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отчёт №3; рейтинг стажёров; основной состав на утверждение.<\/p>", "cls": "wide"}], "owner": "Ольга + контент-лид + аналитик"}, {"t": "Условие перехода дальше", "html": "<p>Выбираем по дисциплине, качеству и отклику, учитывая возраст аккаунта и товар. Один вирусный ролик не заменяет устойчивую работу.<\/p>", "cls": "wide"}]}, {"t": "Четыре креатора и запас на праздники", "week": 3, "cls": "weekcard", "kids": [{"t": "Результат недели", "html": "<p>4 основных креатора; закреплённые аккаунты; 56 роликов за неделю; календарь праздников и съёмочный запас.<\/p>", "cls": "wide"}, {"t": "Метрики недели", "html": "<p>4 креатора × 2 ролика × 7 дней = 56 роликов; публикации по плану ≥95%; запас готового контента на 7 дней к 27.12.<\/p>", "cls": "wide"}, {"t": "Задача этапа", "html": "<p>Стабилизировать выпуск и подготовить материалы на каникулы с учётом доставки и работы отдела продаж.<\/p>", "cls": "wide"}, {"t": "Что нужно от собственников и команды бренда", "key": "brand-needs", "cls": "ownerneeds", "kids": [{"t": "Утвердить состав, товарный фокус и выплаты", "sub": "Ролан; Соня координирует · Начало Н4", "html": "<p>Подтверждены четыре креатора, доступные товары и бюджет регулярного выпуска. Плановые выплаты идут по согласованному графику.<\/p>", "cls": "wide"}, {"t": "Обновить запущенное новогоднее предложение", "sub": "Ролан + Соня + РОП · До дня 24, перед съёмкой праздничных материалов", "html": "<p>По данным запусков Н2–Н3 подтвердить актуальный состав, подарок, цену, маржу и остатки; согласовать изменения и крайние сроки заказа. Это корректировка уже созданного продукта, а не первый запуск.<\/p>", "cls": "wide"}, {"t": "Дать точный график доставки и дежурств", "sub": "Соня + склад + РОП · До конца Н4, ориентир 27.12 при текущем старте", "html": "<p>Последние даты отгрузки, реальные сроки доставки, часы работы менеджеров и ответственный за срочные вопросы. Отдельно подтвердить доступность бренда на 31.12–10.01.<\/p>", "cls": "wide"}, {"t": "Помочь принять запас на каникулы", "sub": "Соня; характеристики проверяет ответственный бренда · До конца Н4", "html": "<p>Согласовать материалы без ожидания праздников; проверить актуальность цен, наличия и обещаний в запасе минимум на 7 дней. Съёмку и сбор запаса выполняет команда проекта.<\/p>", "cls": "wide"}]}, {"t": "Закрепление основного состава", "day": 21, "kids": [{"t": "Что делаем", "html": "<p>Провести план-факт и утвердить 4 креаторов; оформить продолжение работы и доступы по ролям. При пробелах использовать резерв. Зафиксировать личный план и даты выплат.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>4 основных креатора; план выпуска; условия подтверждены.<\/p>", "cls": "wide"}], "owner": "Ольга + менеджер проекта; Ролан"}, {"t": "Масштабирование сильных форматов", "day": 22, "kids": [{"t": "Что делаем", "html": "<p>Собрать повторяемые серии на базе тестов. Увеличить долю подтверждённых сильных подходов, сохранив место для новых гипотез; сравнить коммерческий отклик двух товаров.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Контент-план по сериям; аргументированный товарный фокус.<\/p>", "cls": "wide"}], "owner": "Контент-лид + аналитик"}, {"t": "Корректировка новогоднего предложения", "day": 23, "kids": [{"t": "Что делаем", "html": "<p>Проверить запущенный на Н2 специальный новогодний продукт и его воронки по фактическим обращениям и оплатам. При необходимости скорректировать состав, аргументы и подарок после расчёта маржи. Обновить остатки и предельные сроки доставки; передать изменения креаторам и менеджерам.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Утверждённый оффер; FAQ; сроки доставки во всех точках контакта.<\/p>", "cls": "wide"}], "owner": "Стратег; Соня + РОП + Ролан"}, {"t": "Съёмка запаса на каникулы", "day": 24, "kids": [{"t": "Что делаем", "html": "<p>Снять и принять материалы заранее, не снижая текущий выпуск. Подготовить темы поездок, зимних прогулок и повседневных образов по карте бренда.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Часть запаса принята; расписание публикаций готово.<\/p>", "cls": "wide"}], "owner": "Креаторы + контент-лид"}, {"t": "Продажи и финансовая сверка", "day": 25, "kids": [{"t": "Что делаем", "html": "<p>Сверить заказы, источники, отмены и расходы. Проверить 10 диалогов менеджеров. Сравнить расходы на контент с вкладом подтверждённых заказов, отдельно от общей выручки бренда.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Промежуточный финансовый отчёт; корректировки переписки.<\/p>", "cls": "wide"}], "owner": "Аналитик; РОП + Соня"}, {"t": "Публикации и досъёмка", "day": 26, "kids": [{"t": "Что делаем", "html": "<p>Опубликовать 8 роликов суммарно. Доснять недостающий запас, проверить все ссылки и актуальность товарных остатков.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Публикации выполнены; запас пополнен.<\/p>", "cls": "wide"}], "owner": "Креаторы + контент-лид"}, {"t": "Праздничная готовность", "day": 27, "kids": [{"t": "Что делаем", "html": "<p>Проверить готовность минимум 56 резервных роликов на 7 дней, дежурства и контакт эскалации. Подвести первую полную неделю основного состава.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отчёт №4; запас на 7 дней; календарь дежурств.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта; Соня + РОП"}, {"t": "Условие перехода дальше", "html": "<p>До каникул утверждены дежурства, остатки, даты отгрузок и сроки доставки. Новогодние обещания соответствуют реальному графику.<\/p>", "cls": "wide"}]}, {"t": "Праздничный выпуск и закрытие декабря", "week": 4, "cls": "weekcard", "kids": [{"t": "Результат недели", "html": "<p>56 публикаций за неделю; декабрьский план-факт; актуальные офферы и график обслуживания; заполненный запас на следующую неделю.<\/p>", "cls": "wide"}, {"t": "Метрики недели", "html": "<p>56 роликов; выполнение плана ≥95%; все обращения учитываются; подтверждённые заказы сверены с учётной системой.<\/p>", "cls": "wide"}, {"t": "Задача этапа", "html": "<p>Сохранить выпуск и обработку обращений в период праздников, честно подвести декабрь.<\/p>", "cls": "wide"}, {"t": "Что нужно от собственников и команды бренда", "key": "brand-needs", "cls": "ownerneeds", "kids": [{"t": "Подтвердить январские остатки и условия", "sub": "Соня + склад · Начало Н5 и при каждом изменении", "html": "<p>Актуальные размеры, цены, активные предложения, даты отгрузок и пополнений. Исключить из контента закончившиеся позиции и акции.<\/p>", "cls": "wide"}, {"t": "Обеспечить праздничное дежурство", "sub": "РОП + назначенные менеджеры; Соня — эскалация · Весь период по утверждённому графику", "html": "<p>Обращения принимаются и учитываются, покупатели видят реальные сроки ответа и отгрузки. На согласованные каникулы собственника ежедневный созвон не требуется.<\/p>", "cls": "wide"}, {"t": "Подтвердить материалы на 4–10 января", "sub": "Соня; резерв готовит команда проекта · До 30.12 при текущем старте", "html": "<p>Согласованы товарные условия и необходимые правки к праздничному запасу; есть назначенный контакт для срочной замены оффера.<\/p>", "cls": "wide"}, {"t": "Передать данные для закрытия декабря", "sub": "РОП + ответственный за учёт · После закрытия месяца; окончательно до 11.01", "html": "<p>Оплаты, отмены, возвраты и расходы декабря. Если учёт временно недоступен, назвать срок финальной сверки вместо неподтверждённых итогов.<\/p>", "cls": "wide"}]}, {"t": "Корректировка перед праздниками", "day": 28, "kids": [{"t": "Что делаем", "html": "<p>Провести последнюю плановую встречу декабря. Обновить наличие, офферы и сроки. Подготовить вторую неделю запаса, если креаторы уходят на каникулы до 10.01.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Согласованный календарь до 10.01; задачи дежурных.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта + контент-лид; Соня"}, {"t": "Запас на январь", "day": 29, "kids": [{"t": "Что делаем", "html": "<p>Продолжить 8 публикаций в день суммарно. Снять/принять материалы на 04–10.01; исключить устаревающие скидки и невозможные сроки доставки.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Принят запас на следующую неделю; карточки офферов обновлены.<\/p>", "cls": "wide"}], "owner": "Креаторы + контент-лид"}, {"t": "Контроль января", "day": 30, "kids": [{"t": "Что делаем", "html": "<p>Проверить готовность 56 роликов на 04–10.01 или подтверждённый сменный график съёмок. Протестировать маршрутизацию обращений и уведомления о сроках ответа.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Непрерывный план выпуска; проверенный путь обращения.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта + аналитик; РОП"}, {"t": "31 декабря: дежурный режим", "day": 31, "kids": [{"t": "Что делаем", "html": "<p>Публикации из запаса; актуальные праздничные сообщения и сроки отгрузок. Зафиксировать предварительные итоги месяца; окончательную сверку провести после восстановления полного учёта.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Выпуск сохранён; предварительный декабрьский отчёт.<\/p>", "cls": "wide"}], "owner": "Дежурный контент-менеджер; РОП"}, {"t": "1 января: плановые публикации", "day": 32, "kids": [{"t": "Что делаем", "html": "<p>Выпустить подготовленные ролики. Отвечать по праздничному графику; явно сообщать сроки обработки и отгрузки.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>8 плановых публикаций; обращения не потеряны.<\/p>", "cls": "wide"}], "owner": "Дежурный контент-менеджер; менеджер продаж"}, {"t": "Праздничное наблюдение", "day": 33, "kids": [{"t": "Что делаем", "html": "<p>Продолжить плановый выпуск, проверить вопросы и доступность товаров; передать срочные вопросы ответственному.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отклонения зафиксированы; покупатели получили ответ.<\/p>", "cls": "wide"}], "owner": "Дежурные по контенту и продажам"}, {"t": "Недельная сводка", "day": 34, "kids": [{"t": "Что делаем", "html": "<p>Собрать автоматические/ручные замеры, расходы и заказы. Подготовить краткую сводку без обязательного праздничного созвона.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отчёт №5; повестка январского разбора.<\/p>", "cls": "wide"}], "owner": "Аналитик + менеджер проекта"}, {"t": "Условие перехода дальше", "html": "<p>С 31.12 по 03.01 публикации идут по подготовленному плану. Работу менеджеров и согласования выполняет только заранее назначенное дежурство.<\/p>", "cls": "wide"}]}, {"t": "Январские гипотезы и проверка продаж", "week": 5, "cls": "weekcard", "kids": [{"t": "Результат недели", "html": "<p>56 роликов; обновлённый FAQ; сверка декабря; предварительный список повторяемых сильных форматов.<\/p>", "cls": "wide"}, {"t": "Метрики недели", "html": "<p>56 роликов; 100% опубликованных роликов учтены; замеры в одинаковом возрасте; доля обращений с установленным источником ≥80% как внутренний ориентир.<\/p>", "cls": "wide"}, {"t": "Задача этапа", "html": "<p>Протестировать сценарии каникул и поездок, сравнить коммерческий результат форматов.<\/p>", "cls": "wide"}, {"t": "Что нужно от собственников и команды бренда", "key": "brand-needs", "cls": "ownerneeds", "kids": [{"t": "Поддерживать продажи на каникулах", "sub": "РОП + дежурные менеджеры · Ежедневно по праздничному графику", "html": "<p>Обработка обращений и заполнение реестра; корректные ответы по размерам, наличию и срокам отгрузки.<\/p>", "cls": "wide"}, {"t": "Давать оперативные товарные обновления", "sub": "Соня + склад · По изменению остатков, цен или отгрузок", "html": "<p>Сообщать, что можно продолжать рекламировать, что остановить и чем заменить. Обновлять условия до новых публикаций.<\/p>", "cls": "wide"}, {"t": "Согласовать правки по фактическому спросу", "sub": "Соня; финансовые решения — Ролан · По запросу команды, в согласованное рабочее время", "html": "<p>Подтвердить корректировки офферов и FAQ по вопросам клиенток. Новые скидки и подарки запускаются только после утверждения экономики.<\/p>", "cls": "wide"}, {"t": "Подготовиться к возврату в обычный режим", "sub": "Соня + РОП · До старта Н7 / 11.01", "html": "<p>Подтвердить участие в встрече, передать финальную сверку декабря и список вопросов после каникул. Дополнительных плановых действий собственника сверх решений и сверки не требуется.<\/p>", "cls": "wide"}]}, {"t": "План каникул", "day": 35, "kids": [{"t": "Что делаем", "html": "<p>Проверить работу запаса и дежурства. Уточнить темы зимних поездок и повседневного использования; плановую встречу заменить сводкой, если команда на согласованных каникулах.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>План публикаций и задач подтверждён.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта + контент-лид"}, {"t": "Сравнение серий", "day": 36, "kids": [{"t": "Что делаем", "html": "<p>Сопоставить детализацию товара, разговорную примерку и стилизацию на одинаковых сроках замера. Оценить не только просмотры, но и визиты, вопросы и заказы.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Промежуточная таблица форматов; новые вариации.<\/p>", "cls": "wide"}], "owner": "Аналитик + контент-лид"}, {"t": "Контроль обработки обращений", "day": 37, "kids": [{"t": "Что делаем", "html": "<p>Проверить диалоги дежурных, корректность информации о размерах и отгрузках. Снять частые вопросы в коротких роликах или подготовить задания после каникул.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>FAQ обновлён; ошибки ответов устранены.<\/p>", "cls": "wide"}], "owner": "РОП + контент-лид"}, {"t": "Проверка офферов", "day": 38, "kids": [{"t": "Что делаем", "html": "<p>Сравнить аргументы ценности, подарка и комплекта, если предложения согласованы и сопоставимы по условиям. Не считать разницу доказанной при малом числе заказов.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Первые выводы по офферам с указанием ограничений данных.<\/p>", "cls": "wide"}], "owner": "Стратег + аналитик; РОП"}, {"t": "Финансовая сверка декабря", "day": 39, "kids": [{"t": "Что делаем", "html": "<p>Свести выручку, оплаты, возвраты, расходы и незавершённые заказы; при недоступности учёта перенести финализацию на 11.01. Отдельно показать выручку бренда и заказы с подтверждённым источником.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Декабрьский отчёт либо перечень несверенных строк и срок 11.01.<\/p>", "cls": "wide"}], "owner": "Аналитик; РОП + Соня"}, {"t": "Публикации и резерв", "day": 40, "kids": [{"t": "Что делаем", "html": "<p>Сохранить 8 публикаций суммарно; проверить остаток материалов и готовность к возобновлению обычного режима.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>План выполнен; материалы на старт Н7 готовы.<\/p>", "cls": "wide"}], "owner": "Креаторы/дежурный контент-менеджер"}, {"t": "Итоги каникул", "day": 41, "kids": [{"t": "Что делаем", "html": "<p>Свести два праздничных периода; подготовить задачи для усиления форматов и возможной замены креатора.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отчёт №6; решения для Н7.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта + аналитик"}, {"t": "Условие перехода дальше", "html": "<p>Новые серии публикуются при актуальных остатках и доступной обработке заявок. На праздниках работаем по графику, утверждённому на Н1.<\/p>", "cls": "wide"}]}, {"t": "Усиление работающих связок", "week": 6, "cls": "weekcard", "kids": [{"t": "Результат недели", "html": "<p>56 роликов; обновлённый банк сценариев; решение по составу; расчёт экономики каналов на доступных данных.<\/p>", "cls": "wide"}, {"t": "Метрики недели", "html": "<p>56 роликов; ≥95% выполнения; замеры за последние 30 дней по каждому аккаунту; целевой ориентир 300 тыс. охвата/креатор проверяется отдельно.<\/p>", "cls": "wide"}, {"t": "Задача этапа", "html": "<p>Масштабировать подходы с повторяемым откликом и проверить приближение к целевым охватам.<\/p>", "cls": "wide"}, {"t": "Что нужно от собственников и команды бренда", "key": "brand-needs", "cls": "ownerneeds", "kids": [{"t": "Утвердить актуальный план января", "sub": "Ролан + РОП; Соня координирует · Встреча в начале Н7", "html": "<p>Решение по целям на оставшийся месяц с учётом реального среднего чека, наличия, оплат и бюджета; финализировать декабрьские итоги.<\/p>", "cls": "wide"}, {"t": "Подтвердить товары для усиления", "sub": "Соня + склад; закупки/производство утверждает Ролан · До увеличения доли соответствующих роликов", "html": "<p>Достаточные остатки лидирующих SKU, размерный ряд и сроки пополнения; при необходимости новые образцы и их доставка.<\/p>", "cls": "wide"}, {"t": "Принять коммерческие решения", "sub": "Ролан + Соня · По итогам отчёта Н7", "html": "<p>Подтвердить продолжение/замену креатора и перераспределение уже согласованного бюджета. Любое увеличение расходов утвердить отдельно.<\/p>", "cls": "wide"}, {"t": "Сверить продажи и затраты", "sub": "РОП + ответственный за учёт · К еженедельному отчёту", "html": "<p>Подтверждённые оплаты, возвраты, маржа и расходы для оценки форматов и креаторов. Согласовать товарные приоритеты следующего цикла.<\/p>", "cls": "wide"}]}, {"t": "Возвращение к обычному графику", "day": 42, "kids": [{"t": "Что делаем", "html": "<p>Провести встречу, закрыть финансовую сверку декабря и праздничные вопросы. Пересмотреть план января по фактическому чеку, оплатам и остаткам.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Обновлённая декомпозиция января; решения по ресурсам.<\/p>", "cls": "wide"}], "owner": "Ольга + аналитик; РОП + Соня"}, {"t": "Повтор лидирующих гипотез", "day": 43, "kids": [{"t": "Что делаем", "html": "<p>Запустить новые варианты сильных сюжетов: другой хук, модель, контекст и товарная деталь. Проверить повторяемость результата на нескольких публикациях.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Новые серии на базе подтверждённых наблюдений.<\/p>", "cls": "wide"}], "owner": "Контент-лид + креаторы"}, {"t": "Экономика креаторов", "day": 44, "kids": [{"t": "Что делаем", "html": "<p>Свести фикс, бонусы, образцы, доставку и долю проектных расходов. Рассчитать стоимость выпуска, подтверждённого заказа и вклад после затрат; недостаток атрибуции показать отдельно.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Таблица затрат и подтверждённого результата по креаторам.<\/p>", "cls": "wide"}], "owner": "Аналитик + менеджер проекта"}, {"t": "Разбор и корректировка команды", "day": 45, "kids": [{"t": "Что делаем", "html": "<p>Провести личные разборы; выдать план улучшения отстающим. При устойчивом срыве качества/сроков подключить резерв, не менять человека только из-за одного слабого ролика.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Персональные решения; скорректированный план.<\/p>", "cls": "wide"}], "owner": "Контент-лид + рекрутер"}, {"t": "Сценарии следующего цикла", "day": 46, "kids": [{"t": "Что делаем", "html": "<p>Обновить банк сценариев по комментариям и кастдевам. Отдельно проверить потенциал внесезонного джерси и зависимость комбинезона от наличия/погоды.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Приоритеты контента и товаров на следующий цикл.<\/p>", "cls": "wide"}], "owner": "Стратег + контент-лид; Соня"}, {"t": "Регулярный выпуск", "day": 47, "kids": [{"t": "Что делаем", "html": "<p>Продолжить 8 роликов в день и контроль обращений; пополнить запас готовых материалов.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Публикации выполнены; запас сохранён.<\/p>", "cls": "wide"}], "owner": "Креаторы + контент-лид; РОП"}, {"t": "Недельный контроль охватов", "day": 48, "kids": [{"t": "Что делаем", "html": "<p>Выгрузить 30-дневные охваты каждого аккаунта и просмотры роликов; сравнить с целью, не складывая их в уникальную аудиторию бренда.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отчёт №7; разрыв до цели и действия на Н8.<\/p>", "cls": "wide"}], "owner": "Аналитик + менеджер проекта"}, {"t": "Условие перехода дальше", "html": "<p>Увеличение расходов только при согласованной марже, наличии товара и понятной обработке спроса. Бюджет сверх утверждённого не подразумевается.<\/p>", "cls": "wide"}]}, {"t": "Итоги восьми недель и следующий цикл", "week": 7, "cls": "weekcard", "kids": [{"t": "Результат недели", "html": "<p>56 роликов за неделю; карта бренда и 150+ сценариев; регламенты; итоговый отчёт; план следующего месяца.<\/p>", "cls": "wide"}, {"t": "Метрики недели", "html": "<p>4 креатора; мощность 240 роликов за 30 дней (8/день); цель 300 тыс. охвата на аккаунт за последние 30 дней; суммарно 1,2 млн без дедупликации.<\/p>", "cls": "wide"}, {"t": "Задача этапа", "html": "<p>Проверить выполнение объёма, целевых охватов и коммерческую эффективность; зафиксировать продолжение.<\/p>", "cls": "wide"}, {"t": "Что нужно от собственников и команды бренда", "key": "brand-needs", "cls": "ownerneeds", "kids": [{"t": "Участвовать в итоговом разборе", "sub": "Ролан + Соня + РОП · День 54; финальные замеры в день 56", "html": "<p>Сверить выполненные работы, охваты и коммерческий результат. Зафиксировать незакрытые пункты; январь пока не считать завершённым месяцем.<\/p>", "cls": "wide"}, {"t": "Принять материалы и доступы", "sub": "Соня / назначенный владелец процесса · До завершения Н8", "html": "<p>Подтвердить доступ бренда к аккаунтам, карте бренда, 150+ сценариям, реестру роликов, отчётам и регламентам; назначить, кто ведёт процесс дальше.<\/p>", "cls": "wide"}, {"t": "Утвердить следующий этап", "sub": "Ролан · На итоговой встрече, финальное решение после замеров Н8", "html": "<p>Решить, продолжаем ли работу, какие товары и бюджет используем. Если цель по охватам не достигнута, зафиксировать дополнительные 2 недели по КП и отдельно согласовать выплаты креаторам и иные расходы.<\/p>", "cls": "wide"}, {"t": "Закрыть финансовую сверку", "sub": "РОП + ответственный за учёт; Ролан подтверждает · По согласованному графику итоговой сверки", "html": "<p>Сверенные выплаты, бонусы, расходы, возвраты и подтверждённые заказы. Для отложенных продаж определить, кто дополнит данные после 7/30 дней наблюдения.<\/p>", "cls": "wide"}]}, {"t": "Предварительная проверка целей", "day": 49, "kids": [{"t": "Что делаем", "html": "<p>Провести план-факт. Проверить комплектность результатов: аккаунты, состав, сценарии, выпуск и статистика. Утвердить действия на последнюю неделю.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Предварительная итоговая таблица; список незакрытых пунктов.<\/p>", "cls": "wide"}], "owner": "Ольга + менеджер проекта + аналитик"}, {"t": "Финальные вариации сильных серий", "day": 50, "kids": [{"t": "Что делаем", "html": "<p>Продолжить выпуск и тест наиболее перспективных улучшений. Сохранить единый путь к покупке и актуальные товарные условия.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Новые варианты; актуальный контент-план.<\/p>", "cls": "wide"}], "owner": "Контент-лид + креаторы; РОП"}, {"t": "Передача системы", "day": 51, "kids": [{"t": "Что делаем", "html": "<p>Собрать карту бренда, сценарии, шаблоны ТЗ, реестр роликов, регламент аналитики, контакты и условия креаторов. Проверить доступы владельца бренда.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Комплект материалов и регламент управления переданы.<\/p>", "cls": "wide"}], "owner": "Менеджер проекта + контент-лид"}, {"t": "Итоговая экономика", "day": 52, "kids": [{"t": "Что делаем", "html": "<p>Сверить расходы и подтверждённые заказы, возвраты и маржу. Показать общий результат бренда отдельно; январь отметить незакрытым месяцем.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Коммерческий отчёт с оговорками об атрибуции.<\/p>", "cls": "wide"}], "owner": "Аналитик; РОП + Соня"}, {"t": "Итоговая встреча", "day": 53, "kids": [{"t": "Что делаем", "html": "<p>Показать предварительный результат по 22.01; выбрать дальнейшие товары и бюджет. Если охват отстаёт, подготовить план дополнительных 2 недель по условию КП, без изменения условий в одностороннем порядке.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Протокол решений; план следующего цикла или доработки.<\/p>", "cls": "wide"}], "owner": "Ольга; Ролан + Соня + РОП"}, {"t": "Завершение недельного выпуска", "day": 54, "kids": [{"t": "Что делаем", "html": "<p>Продолжить плановые публикации и пополнение запаса. Снять последние контрольные значения для итогового отчёта.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Выпуск выполнен; финальные замеры собраны.<\/p>", "cls": "wide"}], "owner": "Креаторы + аналитик"}, {"t": "Закрытие восьми недель", "day": 55, "kids": [{"t": "Что делаем", "html": "<p>Снять итоговые 30-дневные охваты по каждому аккаунту на 24.01. Отдать финальный отчёт и зафиксировать следующий этап; роликам младше 7 дней позже дополнить 7-дневные замеры.<\/p>", "cls": "wide"}, {"t": "Готовый результат", "html": "<p>Отчёт №8; выполнение целей; следующий этап с ответственными.<\/p>", "cls": "wide"}], "owner": "Аналитик + менеджер проекта"}, {"t": "Условие перехода дальше", "html": "<p>Если цель по охватам не достигнута, применяем условие КП о дополнительных 2 неделях работы; отдельно фиксируем бюджет выплат креаторам и критерии завершения.<\/p>", "cls": "wide"}]}]}, {"t": "Цели, товары и точка А", "cls": "l1", "kids": [{"t": "10–15 млн ₽ в месяц", "sub": "Бизнес-цель бренда", "kids": [{"t": "Декомпозиция заказов", "html": "<p>При среднем чеке 18 046 ₽: 555 оплаченных заказов для 10 млн ₽ и 832 для 15 млн ₽. Средний чек обновляем по фактическому товарному миксу. Это цель всего бренда, а не гарантия результата контент-завода.<\/p>", "cls": "wide"}, {"t": "Мощность после запуска", "html": "<p>4 креатора × 2 ролика × 30 дней = 240 роликов. За Н3–Н8: 336–392 ролика при 4–8 стажёрах и полном графике, плюс отдельно согласованные ранние тесты. Репосты не считаем новыми роликами.<\/p>", "cls": "wide"}]}, {"t": "Исходные продажи", "kids": [{"t": "Октябрь: 4 157 490 ₽", "sub": "253 оплаты · чек ≈16 433 ₽"}, {"t": "1–25 ноября: 3 909 005 ₽", "sub": "194 оплаты · чек ≈20 150 ₽"}, {"t": "Всего: 8 066 495 ₽", "sub": "447 оплат · чек ≈18 046 ₽"}, {"t": "Рассрочка: 32,8% выручки", "html": "<p>Долями + Яндекс Сплит, 2 643 055 ₽. Долю покупателей, число платежей и первый платёж из этого показателя определить нельзя. Категория «наличка» в отчёте включает также QR, ЮKassa и переводы.<\/p>", "cls": "wide"}, {"t": "Проверка исходных данных", "html": "<p>Ноябрь ещё не закрыт. Между общей выручкой и суммой каналов расхождение 1 200 ₽. На Н1 проверяем уникальные ID заказов, частичные платежи, отмены и возвраты.<\/p>", "cls": "wide"}]}, {"t": "Два товарных направления", "kids": [{"t": "Чёрное джерси №22", "html": "<p>Внесезонная гипотеза. Проверяем примерку, стилизации и поводы покупки. Пока менеджеры не готовы к запуску, тайного покупателя по этой позиции не проводим.<\/p>", "cls": "wide"}, {"t": "Красно-чёрный комбинезон", "html": "<p>Сезонный fashion-продукт для зимних образов. Это не профессиональная горнолыжная экипировка. Температурные характеристики берём только из подтверждённых данных.<\/p>", "cls": "wide"}, {"t": "Как выбираем основной фокус", "html": "<p>Маржа, цена, размеры, остатки, спрос и сроки поставки. Один основной товар, второй как отдельная тестовая гипотеза. Решение фиксируем на Н1–Н2.<\/p>", "cls": "wide"}]}, {"t": "Портрет покупательницы", "html": "<p>Анализ присланных профилей и 10–15 кастдевов в трёх сегментах: первая покупка за последние 30 дней; постоянные клиенты с 3+ заказами; клиенты без повторной покупки 90+ дней. Пересечения учитываем. Способ оплаты сам по себе не определяет доход или образ жизни.<\/p>", "cls": "wide"}]}, {"t": "Метрики и бюджет", "cls": "l1", "kids": [{"t": "14 показателей проекта", "kids": [{"t": "Выручка бренда", "kids": [{"t": "План и ориентир", "html": "<p>10–15 млн ₽/месяц: бизнес-цель клиента, не гарантия результата контент-завода.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Оплаченные заказы за вычетом возвратов; возвраты показывать также отдельно.<\/p>", "cls": "wide"}, {"t": "Ежедневно, сверка еженедельно", "sub": "РОП + аналитик"}]}, {"t": "Оплаченные заказы и чек", "kids": [{"t": "План и ориентир", "html": "<p>При чеке 18 046 ₽: 555 заказов для 10 млн, 832 для 15 млн. Чек пересчитывать по актуальному товарному миксу.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Заказ с уникальным ID; частичные платежи и несколько товаров не создают новых заказов.<\/p>", "cls": "wide"}, {"t": "Ежедневно", "sub": "РОП"}]}, {"t": "Платёжный профиль", "kids": [{"t": "План и ориентир", "html": "<p>32,8% выручки через рассрочку за исходный период. Это не доля клиентов. Цели по доле рассрочки нет.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Отдельно: доля выручки, доля заказов, первый платёж, новые/повторные покупатели.<\/p>", "cls": "wide"}, {"t": "Еженедельно", "sub": "Аналитик + РОП"}]}, {"t": "Состав команды", "kids": [{"t": "План и ориентир", "html": "<p>4 основных креатора к концу Н4; до 8 на стажировке, резерв по итогам отбора.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Работающий креатор с принятой задачей, доступом и выполненным недельным планом.<\/p>", "cls": "wide"}, {"t": "Еженедельно", "sub": "Рекрутер + контент-лид"}]}, {"t": "Выпуск контента", "kids": [{"t": "План и ориентир", "html": "<p>2 ролика/день на креатора; 56/неделю на четверых; 240 за 30 дней. Выполнение ≥95% как внутренний стандарт.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Уникальные принятые и опубликованные ролики; репосты не увеличивают оплачиваемый объём.<\/p>", "cls": "wide"}, {"t": "Ежедневно", "sub": "Контент-лид"}]}, {"t": "Банк сценариев", "kids": [{"t": "План и ориентир", "html": "<p>150 согласованных сценариев к концу Н2; затем обновление по результатам.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Хук, структура, кадры, товар, смысл, CTA, референс и статус согласования.<\/p>", "cls": "wide"}, {"t": "Н2 и далее еженедельно", "sub": "Контент-лид"}]}, {"t": "Охват аккаунтов", "kids": [{"t": "План и ориентир", "html": "<p>Цель КП: 300 тыс. на каждого за последние 30 дней к концу Н8; сумма 1,2 млн без дедупликации.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Уникальный охват внутри каждого аккаунта из статистики. Сумма аккаунтов не равна уникальной аудитории бренда.<\/p>", "cls": "wide"}, {"t": "Еженедельно; финал Н8", "sub": "Аналитик"}]}, {"t": "Просмотры и качество ролика", "kids": [{"t": "План и ориентир", "html": "<p>Базу устанавливаем на Н3; не вводим гарантированный минимум просмотров каждому ролику.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Замеры 24ч/72ч/7д: просмотры, удержание где доступно, сохранения, репосты, комментарии; медиана по серии.<\/p>", "cls": "wide"}, {"t": "По срокам замера", "sub": "Аналитик"}]}, {"t": "Переходы и обращения", "kids": [{"t": "План и ориентир", "html": "<p>Улучшение к базе Н1; числовой план утверждаем после первой недели измерений.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Визиты в профиль, клики по размеченным ссылкам, уникальные обращения, вопросы по товару.<\/p>", "cls": "wide"}, {"t": "Ежедневно", "sub": "Аналитик + РОП"}]}, {"t": "Обработка обращений", "kids": [{"t": "План и ориентир", "html": "<p>Предлагаемый SLA: медиана первого ответа ≤15 мин, 90% ≤60 мин в рабочие часы; на праздники отдельный график.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Время до первого ответа человека; ночные обращения учитываются с начала следующей смены. Нужны базовый замер и подтверждение РОПа.<\/p>", "cls": "wide"}, {"t": "Ежедневно", "sub": "РОП"}]}, {"t": "Учёт источников", "kids": [{"t": "План и ориентир", "html": "<p>100% новых обращений в реестре с Д3; ориентир ≥80% с установленным источником с Н3.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>UTM/код/самоотчёт клиента: первичный контакт, последний контакт и степень уверенности. «Неизвестно» сохраняется.<\/p>", "cls": "wide"}, {"t": "Ежедневно", "sub": "РОП + аналитик"}]}, {"t": "Конверсия и стоимость заказа", "kids": [{"t": "План и ориентир", "html": "<p>Числовой план на Н2 после замера Н1 и расчёта маржи. 0,1% из звонка не используем как подтверждённый норматив.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Обращение → оплата = оплаченные заказы / уникальные обращения одной когорты. Стоимость = расходы / подтверждённые заказы.<\/p>", "cls": "wide"}, {"t": "Еженедельно", "sub": "Аналитик"}]}, {"t": "Маржинальный результат", "kids": [{"t": "План и ориентир", "html": "<p>Положительный вклад после переменных затрат и согласованных расходов; лимит стоимости заказа утверждаем по SKU.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Выручка минус возвраты, производство, упаковка, комиссии, субсидия доставки, подарки и расходы канала. Проектные затраты показываются отдельно.<\/p>", "cls": "wide"}, {"t": "Еженедельно и итог", "sub": "Аналитик + Ролан"}]}, {"t": "Согласования и запас", "kids": [{"t": "План и ориентир", "html": "<p>По КП до 2 рабочих дней на согласование; к праздникам 7 дней готового контента.<\/p>", "cls": "wide"}, {"t": "Как считаем", "html": "<p>Дата отправки, ответственный, срок, статус, влияние задержки на зависимые задачи.<\/p>", "cls": "wide"}, {"t": "Ежедневно", "sub": "Менеджер проекта + Соня"}]}]}, {"t": "Бюджет по презентации", "kids": [{"t": "Услуги команды: 150 000 ₽", "html": "<p>Разовая сумма за весь проект 6–8 недель. В КП указана 100% предоплата. Статус оплаты здесь не предполагается.<\/p>", "cls": "wide"}, {"t": "Стажировка: 28–56 тыс. ₽", "html": "<p>4–8 человек × 14 роликов × 500 ₽. Н3. Условия оплаты тестовых заданий до стажировки согласуются отдельно.<\/p>", "cls": "wide"}, {"t": "Основной состав: 28 тыс. ₽ / неделю", "html": "<p>4 × 2 × 7 = 56 роликов по 500 ₽. За 30 дней 120 тыс. ₽, за 31 день 124 тыс. ₽.<\/p>", "cls": "wide"}, {"t": "Фикс креаторам за Н3–Н8: 168–196 тыс. ₽", "html": "<p>Стажировка + 5 недель основного состава. Стажировочные ролики не оплачиваем повторно.<\/p>", "cls": "wide"}, {"t": "Команда + фикс: 318–346 тыс. ₽", "html": "<p>Расчёт за 8 недель без бонусов, ранних тестов, образцов, доставки, найма и внешних размещений.<\/p>", "cls": "wide"}, {"t": "Бонусы: ориентир 20–40 тыс. ₽ / месяц", "kids": [{"t": "Сетка из КП", "html": "<ul><li>От 100 тыс. просмотров: +1 000 ₽<\/li><li>От 500 тыс.: +3 000 ₽<\/li><li>От 1 млн: +7 000 ₽<\/li><li>300 тыс. охвата аккаунта за месяц: +5 000 ₽<\/li><\/ul><p>До старта фиксируем окно замера, правила суммирования и бюджетный лимит.<\/p>", "cls": "wide"}, {"t": "Цена ролика с бонусами", "html": "<p>При 240 роликах и бонусах 20–40 тыс. ₽: 583–667 ₽. Ориентир ≈625 ₽ из КП соответствует фонду 30 тыс. ₽; не включает услуги команды и другие расходы.<\/p>", "cls": "wide"}]}, {"t": "Дополнительные расходы", "html": "<p>Образцы по себестоимости и условиям передачи/возврата; доставка; вакансии; ранние тесты. Лимиты уточняем на Н1. Внешние блогерские размещения имеют отдельный бюджет и решение.<\/p>", "cls": "wide"}, {"t": "Если не достигнут целевой охват", "html": "<p>В КП предусмотрены дополнительные 2 недели работы команды бесплатно. Выплаты креаторам и другие затраты фиксируются отдельно. Проверка цели: последние 30 дней на дату окончания Н8.<\/p>", "cls": "wide"}]}, {"t": "Как связываем контент с деньгами", "kids": [{"t": "Не складываем разные показатели", "html": "<p>Просмотры роликов ≠ уникальный охват аккаунта. Сумма охватов четырёх аккаунтов может включать одних и тех же людей. 300 тыс. × 4 = 1,2 млн суммарно без дедупликации.<\/p>", "cls": "wide"}, {"t": "Не приписываем весь рост одному каналу", "html": "<p>Выручка всего бренда отдельно от заказов с подтверждённым источником. Один заказ учитывается один раз. Сохраняем неизвестный источник и отложенные покупки; сверяем возвраты.<\/p>", "cls": "wide"}, {"t": "Считаем вклад после затрат", "html": "<p>Цена минус возвраты, производство, упаковка, комиссии, субсидия доставки, подарок и расходы канала. Из доступного вклада и требуемой прибыли определяем предел стоимости привлечения.<\/p>", "cls": "wide"}, {"t": "Гипотезы из звонка", "html": "<p>0,1% конверсии и 6–10 контактов в день не являются измеренными нормативами проекта. Числовые планы конверсии и стоимости заказа утверждаем после замера базы и экономики.<\/p>", "cls": "wide"}]}]}, {"t": "Команда и правила работы", "cls": "l1", "kids": [{"t": "Кто за что отвечает", "kids": [{"t": "Ольга Пузанова", "html": "<p>Стратегия, ключевые гипотезы, контроль проекта; обучение и разбор с РОПом и Роланом.<\/p>", "cls": "wide"}, {"t": "Менеджер проекта", "html": "<p>Календарь, задачи, сроки, согласования, ежедневный статус и эскалация препятствий.<\/p>", "cls": "wide"}, {"t": "Контент-лид", "html": "<p>Банк сценариев, постановка ТЗ, приёмка роликов, обратная связь и контроль выпуска.<\/p>", "cls": "wide"}, {"t": "Рекрутер", "html": "<p>Вакансии, анкеты, собеседования, тесты и резерв креаторов.<\/p>", "cls": "wide"}, {"t": "Аналитик", "html": "<p>Охваты, просмотры, переходы, обращения, оплаченные заказы и расходы; еженедельный отчёт.<\/p>", "cls": "wide"}, {"t": "Соня", "html": "<p>Основной контакт бренда: материалы, товары, размеры, доставка, правки и сбор согласований.<\/p>", "cls": "wide"}, {"t": "Ролан", "html": "<p>Цели, экономика, бюджеты, спорные вопросы; участие в разборе подбора блогеров.<\/p>", "cls": "wide"}, {"t": "РОП и менеджеры", "html": "<p>Кастдевы, ответы покупателям, источники обращений, оплаты, возвраты и обратная связь.<\/p>", "cls": "wide"}, {"t": "Креаторы", "html": "<p>По 2 принятых опубликованных ролика в день на человека, правки и передача статистики.<\/p>", "cls": "wide"}]}, {"t": "Ежедневный статус", "html": "<ol><li>Что готово и где результат.<\/li><li>План / факт публикаций и обращений.<\/li><li>Что мешает и на что влияет.<\/li><li>Решение: кто принимает и когда.<\/li><li>План следующего рабочего дня.<\/li><\/ol><p>На выходных и праздниках работаем по утверждённым дежурствам.<\/p>", "cls": "wide"}, {"t": "Встреча раз в неделю", "html": "<p>30–45 минут: план/факт, расходы, метрики, гипотезы, решения, следующая неделя. Предлагаемый день: понедельник, время согласуется с Соней. Отчёт по итогам воскресенья. На каникулах допустима письменная сводка.<\/p>", "cls": "wide"}, {"t": "Согласования и препятствия", "html": "<p>По КП: до 2 рабочих дней на согласование. При задержке образцов, решений или данных менеджер проекта фиксирует влияние на зависимые задачи в течение рабочего дня. Остальные работы продолжаются.<\/p>", "cls": "wide"}, {"t": "Каникулы без паузы в выпуске", "html": "<p>До 27.12: запас на 7 дней, график ответов и отгрузок. До 30.12: готовность контента на 04–10.01 или подтверждённый график съёмок. Праздничные сроки не обещаем без подтверждения бренда.<\/p>", "cls": "wide"}, {"t": "Внешние блогеры", "html": "<p>В карте есть разбор критериев подбора с Роланом. Ведение 40–50 интеграций в месяц не входит автоматически в обязательства проекта; условия обсуждаются отдельно.<\/p>", "cls": "wide"}]}, {"t": "Уже получено и что подтвердить", "cls": "l1", "kids": [{"t": "Уже получено", "html": "<ul><li>Бриф и установочная встреча.<\/li><li>Профили покупателей.<\/li><li>Топ и антитоп роликов.<\/li><li>Аналитика октября–ноября.<\/li><li>Коммерческая презентация.<\/li><\/ul><p>Профили и подборки получены со стороны бренда по сообщению Ольги. Детальный разбор выполняется на Н1.<\/p>", "cls": "wide"}, {"t": "Подтвердить на Н1", "html": "<ul><li>Цены, себестоимость, остатки и размеры.<\/li><li>Сроки отправки и получения образцов.<\/li><li>Бюджет найма, тестов, стажировки и бонусов.<\/li><li>Доли новых/повторных покупателей, число платежей и первый платёж.<\/li><li>Рабочие часы, дежурства и доступ к статистике.<\/li><li>Условия размещений и права на контент.<\/li><\/ul>", "cls": "wide"}, {"t": "Статус этой карты", "html": "<p>Старт 30.11 предложен, а не подтверждён. Конкретные дневные задачи, 10–15 интервью, воронка найма, SLA, шкала отбора и запас материалов являются рабочим планом для согласования. Уже достигнутыми результатами они не обозначены.<\/p>", "cls": "wide"}, {"t": "Источники", "html": "<p><a href=\"https://petrov.chatium.ru/nalrassrochka\" target=\"_blank\" rel=\"noopener\">Аналитика октября–ноября<\/a><\/p><p><a href=\"https://claude.ai/artifact/QxdwhWNpbpHz1okbx9P84u#slide-3dd33bdac6c2\" target=\"_blank\" rel=\"noopener\">Презентация проекта<\/a><\/p><p>Также использован транскрипт установочного звонка.<\/p>", "cls": "wide"}]}]}, "detail": "PCFkb2N0eXBlIGh0bWw+PGh0bWwgbGFuZz0icnUiPjxoZWFkPjxtZXRhIGNoYXJzZXQ9InV0Zi04Ij48bWV0YSBuYW1lPSJ2aWV3cG9ydCIgY29udGVudD0id2lkdGg9ZGV2aWNlLXdpZHRoLGluaXRpYWwtc2NhbGU9MSI+PHRpdGxlPk1hbGlrYSBBdGVsaWVyIOKAoiDQlNC+0YDQvtC20L3QsNGPINC60LDRgNGC0LAg0L3QsCA4INC90LXQtNC10LvRjDwvdGl0bGU+PHN0eWxlPgo6cm9vdHstLWJnOiNmNmY1ZjE7LS1wYXBlcjojZmZmOy0taW5rOiMyMjJmMmI7LS1tdXRlZDojNjU3MTZiOy0tbGluZTojZGNlMWQ5Oy0tZ3JlZW46IzI1NGMzZDstLWxpbWU6I2Q0ZWQ5ZjstLWdvbGQ6I2Y0ZTVjODstLXJhZGl1czoxOHB4fSp7Ym94LXNpemluZzpib3JkZXItYm94fWh0bWx7c2Nyb2xsLWJlaGF2aW9yOnNtb290aH1ib2R5e21hcmdpbjowO2JhY2tncm91bmQ6dmFyKC0tYmcpO2NvbG9yOnZhcigtLWluayk7Zm9udDoxNXB4LzEuNiAtYXBwbGUtc3lzdGVtLEJsaW5rTWFjU3lzdGVtRm9udCwnU2Vnb2UgVUknLHNhbnMtc2VyaWZ9YnV0dG9uLGlucHV0LHNlbGVjdHtmb250OmluaGVyaXR9YnV0dG9uLGEsaW5wdXQsc2VsZWN0e291dGxpbmUtb2Zmc2V0OjRweH1idXR0b257Y3Vyc29yOnBvaW50ZXJ9YXtjb2xvcjp2YXIoLS1ncmVlbil9LndyYXB7bWF4LXdpZHRoOjEyNjBweDttYXJnaW46YXV0bztwYWRkaW5nOjAgMzBweH1oZWFkZXJ7YmFja2dyb3VuZDp2YXIoLS1ncmVlbik7Y29sb3I6d2hpdGU7cGFkZGluZzo
